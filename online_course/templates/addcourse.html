{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}
{% block content %}

<style>


    .background {
    width: 100%;
    min-height: 100vh;

    background-image: url("{% static 'img/index.png' %}");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    color: white;

}

    </style>





<div class="background ">

<div class=" container w-50 border border-3 p-5 wow fadeInUp pb-3 position-absolute mt-5 " style="margin-left: 380px">
<form method="post" enctype="multipart/form-data" class="animated slideInUp text-dark">

    {% csrf_token %}
    <div class="row">
        <div class="col">

    <div class="mb-3">
  <label for="exampleFormControlInput1"  class="form-label">Course Name*</label>
  <input type="text" class="form-control" name="name"  placeholder="Course Name">
</div>
            </div>
        <div class="col">

<div class="mb-3">

      <label for="exampleFormControlInput1" class="form-label">Duration*</label>
  <input type="number" class="form-control" name="duration"   placeholder="Duration">
</div>


            </div>

        </div>


            <div class="mb-3">
                 <label for="exampleFormControlTextarea1" class="form-label">Description*</label>
  <textarea class="form-control" name="description"  rows="3"></textarea>
</div>

       <div class="row">
        <div class="col">


        <div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Price*</label>
  <input type="number" class="form-control" name="price"   placeholder="Price">
</div>
        </div>
            <div class="col">

            <div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Modules*</label>
  <input type="number" class="form-control" name="modules"  placeholder="Modules">
</div>

        </div>
       </div>

            <div class="mb-3">
  <label for="exampleFormControlInput1" class="form-label">Image*</label>
  <input type="file" class="form-control" name="image"   placeholder="Image">
</div>


    <button type="submit" class="form-control" style="background-color: #7f25ab;color: white">Submit</button>

 </form>
</div>


</div>


{% endblock %}
