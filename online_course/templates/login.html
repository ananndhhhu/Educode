{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load static %}
{% block content %}

<style>


    .background {
    width: 100%;
    min-height: 100vh;

    background-image: url("{% static 'img/index.png' %}");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: white;

}

    </style>


<div class="background">



<div class=" container w-50 border border-3  p-5 position-absolute " style="margin-left: 380px; margin-top: 100px">
<form method="post" enctype="multipart/form-data" class="text-dark" >


                <h1 class="mb-5"><i class="fa-regular fa-user "style="margin-left: 250px"></i>Login</h1>


    {% csrf_token %}
    {{ form | crispy }}
  <button type="submit" class="form-control mt-5" style="background-color: #7f25ab;color: white">Login</button>


        {% if messages %}
<ul class="messages text-danger mt-3" type="none">
    {% for message in messages %}
    <li>{{ message }}</li>
    {% endfor %}
</ul>


 </form>

    </div>


{% endif %}

</ul>




</div>


</div>


{% endblock %}
